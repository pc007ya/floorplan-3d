name: Verify traced home 3D
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/*.test.mjs
      - run: npm install --no-save --ignore-scripts three@0.160.0 playwright@1.51.1
      - run: npx playwright install --with-deps chromium
      - run: node scripts/build.mjs --vendor
      - name: Browser smoke test
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/home-http.log 2>&1 &
          node scripts/smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: home-3d-build-and-verification
          path: |
            dist/
            artifacts/
          retention-days: 14
